name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: plugin-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate every plugin (strict)
        run: |
          set -e
          for p in plugins/*/; do
            echo "── $p"
            claude plugin validate "$p" --strict
          done

      - name: Marketplace ↔ plugin version sync
        run: node scripts/check-version-sync.mjs

  cli-contract:
    name: fluree-cli contract vs released manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest is generated by the fluree binary itself (hidden
      # `fluree manifest` command) and published as a release asset by
      # fluree/db — validating against it means validating against what
      # actually shipped, without building anything.
      - name: Download latest fluree CLI manifest
        id: manifest
        run: |
          if curl -fsSL -o /tmp/fluree-cli-manifest.json \
              https://github.com/fluree/db/releases/latest/download/fluree-cli-manifest.json; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::fluree-cli-manifest.json is not on the latest fluree/db release yet — contract check skipped. Once the first release ships it, remove this skip so the check is required."
          fi

      - name: Check cli-facts contract
        if: steps.manifest.outputs.found == 'true'
        run: node scripts/check-cli-contract.mjs plugins/fluree-cli/contract/cli-facts.json /tmp/fluree-cli-manifest.json
