name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: plugin-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a change to --strict's warning set can't turn this repo red
      # without a commit here; bump deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Validate every plugin (strict)
        run: |
          set -e
          for p in plugins/*/; do
            echo "── $p"
            claude plugin validate "$p" --strict
          done

      # The marketplace manifest is what gates every /plugin install — it
      # needs validating too, and the per-plugin loop above never sees it.
      - name: Validate marketplace root (strict)
        run: claude plugin validate . --strict

      - name: Marketplace ↔ plugin version sync
        run: node scripts/check-version-sync.mjs

      # Neither `claude plugin validate` nor the contract checker reads
      # .mcp.json (verified: it passes validation even as non-JSON), so at
      # minimum pin its syntax.
      - name: MCP server configs parse
        run: |
          set -e
          for f in plugins/*/.mcp.json; do
            node -e "JSON.parse(require('node:fs').readFileSync('$f','utf-8'))" \
              && echo "ok: $f"
          done

  cli-contract:
    name: fluree-cli contract vs released manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest is generated by the fluree binary itself (hidden
      # `fluree manifest` command) and published as a release asset by
      # fluree/db — validating against it means validating against what
      # actually shipped, without building anything. The URL lives in the
      # facts file (single source of truth). fluree/db v4.1.5 ships the
      # asset, so a missing manifest is an infrastructure failure now, not
      # a skip (issue #2).
      - name: Download latest fluree CLI manifest
        run: |
          set -euo pipefail
          url=$(node -p "JSON.parse(require('node:fs').readFileSync('plugins/fluree-cli/contract/cli-facts.json','utf-8')).manifest_source")
          curl -fsSL -o /tmp/fluree-cli-manifest.json "$url"

      - name: Check cli-facts contract
        run: node scripts/check-cli-contract.mjs plugins/fluree-cli/contract/cli-facts.json /tmp/fluree-cli-manifest.json
